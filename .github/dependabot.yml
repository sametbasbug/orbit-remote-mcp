version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    versioning-strategy: "increase"
    groups:
      non-major-updates:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    groups:
      action-updates:
        patterns:
          - "*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
